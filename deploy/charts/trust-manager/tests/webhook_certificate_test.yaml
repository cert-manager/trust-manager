suite: Certificate CA Injection
templates:
  - templates/certificate.yaml
release:
  name: tm
  namespace: trust
tests:
  - it: should allow direct secret injection when helmCert is disabled
    set:
      app:
        webhook:
          tls:
            helmCert:
              enabled: false

    documentSelector:
      path: kind
      value: Certificate

    asserts:
      - equal:
          path: spec.secretTemplate.annotations["cert-manager.io/allow-direct-injection"]
          value: "true"

  - it: should preserve user supplied secretTemplate annotations
    set:
      app:
        webhook:
          tls:
            helmCert:
              enabled: false
            certificate:
              secretTemplate:
                annotations:
                  test-annotation: test-value

    documentSelector:
      path: kind
      value: Certificate

    asserts:
      - equal:
          path: spec.secretTemplate.annotations["cert-manager.io/allow-direct-injection"]
          value: "true"

      - equal:
          path: spec.secretTemplate.annotations["test-annotation"]
          value: test-value

  - it: should identify the webhook certificate by dnsNames only
    documentSelector:
      path: kind
      value: Certificate

    asserts:
      - notExists:
          path: spec.commonName
      - equal:
          path: spec.dnsNames
          value:
            - trust-manager.trust.svc

  - it: should not require a commonName in the approver-policy CertificateRequestPolicy
    set:
      app:
        webhook:
          tls:
            approverPolicy:
              enabled: true

    documentSelector:
      path: kind
      value: CertificateRequestPolicy

    asserts:
      - notExists:
          path: spec.allowed.commonName
      - equal:
          path: spec.allowed.dnsNames
          value:
            values: ["trust-manager.trust.svc"]
            required: true
